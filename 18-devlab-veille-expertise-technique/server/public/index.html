<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picard Sensor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h3 mb-0">Picard Sensor</h1>
    <p class="text-muted mb-4">Nos distributeurs</p>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <div class="text-muted small">Température</div>
            <div class="display-6" id="temp">--</div>
            <div class="text-muted small" id="hum"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <div class="text-muted small">Porte</div>
            <div class="display-6" id="door">--</div>
            <div class="text-muted small" id="dist"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <div class="text-muted small">Dernière mesure</div>
            <div class="fs-5" id="when">--</div>
            <div class="text-muted small" id="meta"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-muted">Historique</span>
      <button class="btn btn-outline-danger btn-sm" id="clear">Supprimer</button>
    </div>
    <table class="table table-sm table-striped bg-white">
      <thead>
        <tr><th>Reçu</th><th>Machine</th><th>Temp (°C)</th><th>Hum. (%)</th><th>Porte</th><th>Distance (cm)</th><th>RSSI</th><th>Uptime</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const fmtTemp = (t) => (t === null || t === undefined) ? 'n/a' : t.toFixed(1) + ' °C';
    const fmtNum = (v) => (v === null || v === undefined) ? 'n/a' : v;
    const fmtDate = (iso) => new Date(iso).toLocaleTimeString('fr-FR');

    let list = [];

    function render() {
      if (list.length === 0) {
        document.getElementById('rows').innerHTML = '';
        ['temp', 'door', 'when'].forEach((id) => { document.getElementById(id).textContent = '--'; });
        document.getElementById('door').className = 'display-6';
        document.getElementById('hum').textContent = '';
        document.getElementById('dist').textContent = '';
        document.getElementById('meta').textContent = '';
        return;
      }

      const last = list[0];
      document.getElementById('temp').textContent = fmtTemp(last.temp_c);
      document.getElementById('hum').textContent = 'humidité ' + fmtNum(last.humidity) + ' %';
      document.getElementById('dist').textContent = 'distance ' + fmtNum(last.distance_cm) + ' cm';
      const door = document.getElementById('door');
      door.textContent = last.door_open ? 'ouverte' : 'fermée';
      door.className = 'display-6 ' + (last.door_open ? 'text-danger' : 'text-success');
      document.getElementById('when').textContent = fmtDate(last.received_at);
      document.getElementById('meta').textContent = last.device + ', rssi ' + last.rssi + ' dBm';

      document.getElementById('rows').innerHTML = list.map((r) => `
        <tr>
          <td>${fmtDate(r.received_at)}</td>
          <td>${r.device}</td>
          <td>${fmtTemp(r.temp_c)}</td>
          <td>${fmtNum(r.humidity)}</td>
          <td>${r.door_open ? 'ouverte' : 'fermée'}</td>
          <td>${fmtNum(r.distance_cm)}</td>
          <td>${r.rssi}</td>
          <td>${r.uptime_s} s</td>
        </tr>`).join('');
    }

    async function load() {
      list = await fetch('/api/readings').then((r) => r.json());
      render();
    }

    // server pushes each post from the board, no polling
    new EventSource('/api/stream').onmessage = (e) => {
      list.unshift(JSON.parse(e.data));
      list = list.slice(0, 50);
      render();
    };

    document.getElementById('clear').addEventListener('click', async () => {
      await fetch('/api/readings', { method: 'DELETE' });
      list = [];
      render();
    });

    load();
  </script>
</body>
</html>
