<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picard Vision</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container py-4">

    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold text-primary">Picard Vision</h1>
      <p class="lead mb-0">Montrez un produit, on vous dit ce que c'est.</p>
    </header>

    <div id="status" class="alert alert-secondary text-center fs-4" role="status">
      Chargement du modèle...
    </div>

    <!-- preview zone: image, webcam or captured frame -->
    <section id="preview" class="preview mx-auto mb-4">
      <img id="photo" alt="Image à analyser" hidden>
      <video id="cam" autoplay playsinline muted hidden></video>
      <canvas id="frame" hidden></canvas>
      <p id="placeholder" class="text-muted fs-3 m-0">Aucune image pour le moment</p>
    </section>

    <section id="sources" class="d-grid gap-3 d-md-flex justify-content-md-center mb-4">
      <label class="btn btn-outline-primary btn-lg btn-kiosk" for="file">
        Choisir une image
        <input id="file" type="file" accept="image/*" hidden>
      </label>
      <button id="webcam" class="btn btn-outline-primary btn-lg btn-kiosk" type="button">Webcam</button>
      <button id="capture" class="btn btn-outline-primary btn-lg btn-kiosk" type="button" hidden>Prendre la photo</button>
    </section>

    <section class="d-grid gap-3 d-md-flex justify-content-md-center mb-4">
      <button id="analyze" class="btn btn-primary btn-lg btn-kiosk" type="button" disabled>Analyser</button>
      <button id="reset" class="btn btn-secondary btn-lg btn-kiosk" type="button">Recommencer</button>
    </section>

    <div id="warning" class="alert alert-warning text-center fs-4" role="alert" hidden></div>

    <section id="results" class="mx-auto"></section>

  </main>

  <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
  <script src="app.js"></script>
</body>
</html>
